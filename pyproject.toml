[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stingray-dashboard"
version = "3.4.0"
description = "Installable Dash application for the NES-LTER Stingray dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anh H. Pham" },
    { name = "E. Taylor Crockford" },
    { name = "Heidi M. Sosik" },
]
keywords = [
    "NES-LTER",
    "Stingray",
    "ISIIS",
    "oceanography",
    "dashboard",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "dash>=4.4,<5",
    "flask-compress>=1.13",
    "numpy>=1.26",
    "pandas>=2.0",
    "pillow>=10",
    "plotly>=7,<8",
]

[project.urls]
Homepage = "https://github.com/WHOIGit/stingray-dashboard"
Repository = "https://github.com/WHOIGit/stingray-dashboard"
Issues = "https://github.com/WHOIGit/stingray-dashboard/issues"

[project.scripts]
stingray-dashboard = "stingray_dashboard.app:main"

[project.optional-dependencies]
server = [
    "gunicorn>=21; platform_system != 'Windows'",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["stingray_dashboard*"]

[tool.setuptools.package-data]
stingray_dashboard = [
    "assets/*",
    "data_reference/*",
]
